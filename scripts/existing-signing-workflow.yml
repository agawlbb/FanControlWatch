name: Fan Control Watch TestFlight
on:
  push:
    branches: [codex/fancontrol-watch-testflight]
    paths: [.github/workflows/fancontrol-watch-testflight.yml]
permissions:
  contents: read
concurrency:
  group: fancontrol-watch-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_TEAM_ID: FKR675M7PM
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: '1'
      UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: agawlbb/FanControlWatch
          ref: 233cac2b77bff814ae8bbb6ebce928ffa42b1b14
      - name: Prepare existing Apple signing authentication
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DEVELOPMENT_CERT_P12: ${{ secrets.IOS_DEVELOPMENT_CERT_P12 }}
          IOS_DEVELOPMENT_CERT_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERT_PASSWORD }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_PRIVATE_KEY"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$RUNNER_TEMP/watch-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/watch-signing.keychain-db"
          security unlock-keychain -p "$password" "$RUNNER_TEMP/watch-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/watch-signing.keychain-db" login.keychain-db
          security default-keychain -d user -s "$RUNNER_TEMP/watch-signing.keychain-db"
          test -n "$IOS_DEVELOPMENT_CERT_P12" && test -n "$IOS_DEVELOPMENT_CERT_PASSWORD"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'development.p12').write_bytes(base64.b64decode(os.environ['IOS_DEVELOPMENT_CERT_P12'], validate=True))
          PY
          security import "$RUNNER_TEMP/development.p12" -k "$RUNNER_TEMP/watch-signing.keychain-db" -P "$IOS_DEVELOPMENT_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$RUNNER_TEMP/watch-signing.keychain-db" >/dev/null
      - run: brew install xcodegen
      - name: Build, verify, sign and upload watch-only app
        run: bash scripts/testflight.sh
      - uses: actions/upload-artifact@v4
        if: false
        with:
          name: FanControlWatch-signed
          path: build/signed/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/watch-signing.keychain-db" || true
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/development.p12"




