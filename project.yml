name: FanControlWatch
options:
  bundleIdPrefix: dev.fancontrol
  deploymentTarget:
    watchOS: '10.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: FKR675M7PM
    MARKETING_VERSION: '0.9.1'
    CURRENT_PROJECT_VERSION: '19'
packages:
  FanControlCore:
    path: .
targets:
  ActivePanelComplication:
    type: app-extension
    platform: watchOS
    sources: [Complication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fancontrol.watch.watchkitapp.activepanel
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Complication/Info.plist
      properties:
        CFBundleDisplayName: Active Panel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FanControlWatch:
    type: application
    platform: watchOS
    sources: [WatchApp]
    dependencies:
      - package: FanControlCore
      - target: ActivePanelComplication
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fancontrol.watch.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    entitlements:
      path: WatchApp/FanControlWatch.entitlements
      properties:
        aps-environment: development
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Fan Control
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: dev.fancontrol.watch
        UIBackgroundModes: [audio, remote-notification]
        FanControlAPNSEnvironment: $(APNS_ENVIRONMENT)
        NSLocalNetworkUsageDescription: Connect to your Home Assistant for watch pairing and approved controls.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.fancontrol.watch.active
            CFBundleURLSchemes: [fancontrol]
    scheme:
      gatherCoverageData: false
  FanControl:
    type: application
    platform: iOS
    sources: [PhoneApp]
    dependencies:
      - package: FanControlCore
      - target: FanControlWatch
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fancontrol.watch
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    entitlements:
      path: PhoneApp/FanControl.entitlements
      properties:
        aps-environment: development
    info:
      path: PhoneApp/Info.plist
      properties:
        CFBundleDisplayName: Fan Control
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [dev.fancontrol.watch.phone.refresh]
        FanControlAPNSEnvironment: $(APNS_ENVIRONMENT)
        NSLocalNetworkUsageDescription: Connect to your Home Assistant.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    scheme:
      gatherCoverageData: false


