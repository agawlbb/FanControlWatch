# Final step of the explicitly approved one-use release bridge.
name: Remove completed foreground release bridge
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-handoff.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repository = context.repo;
            const main = await github.rest.git.getRef({...repository, ref: 'heads/main'});
            if (main.data.object.sha !== context.sha) {
              throw new Error('Main moved; refusing cleanup over newer work.');
            }
            for (const branch of ['fix/foreground-command-handoff', 'release/foreground-build-23']) {
              let head;
              try { head = await github.rest.git.getRef({...repository, ref: `heads/${branch}`}); }
              catch (error) { if (error.status === 404) continue; throw error; }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...repository, basehead: `${head.data.object.sha}...main`
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                throw new Error('Branch contains unmerged work; refusing deletion.');
              }
              await github.rest.git.deleteRef({...repository, ref: `heads/${branch}`});
            }
            const path = '.github/workflows/release-handoff.yml';
            const file = await github.rest.repos.getContent({...repository, path, ref: context.sha});
            await github.rest.repos.deleteFile({
              ...repository, path, sha: file.data.sha, branch: 'main',
              message: 'Remove completed one-use release bridge [skip ci]'
            });
