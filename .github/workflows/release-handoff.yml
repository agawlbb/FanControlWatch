# One-use bridge for the user-authorized release; removed after dispatch.
name: Release handoff correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-handoff.yml]
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repository = context.repo;
            const branch = 'fix/stale-handoff-alerts';
            const head = await github.rest.git.getRef({...repository, ref: `heads/${branch}`});
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...repository, basehead: `${head.data.object.sha}...main`
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('Task branch is not fully merged; refusing cleanup/release.');
            }
            await github.rest.git.deleteRef({...repository, ref: `heads/${branch}`});
            await github.rest.actions.createWorkflowDispatch({
              ...repository, workflow_id: 'testflight.yml', ref: 'main',
              inputs: {build_number: '22', upload: 'true'}
            });
