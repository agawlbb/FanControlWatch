name: watchOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run core tests and compile unsigned simulators only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test encrypted transport and command evidence
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iPhone simulator companion
        run: xcodebuild -project FanControlWatch.xcodeproj -scheme FanControl -destination 'generic/platform=iOS Simulator' -derivedDataPath build-phone CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPhone companion
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.validation_only) }}
        run: bash scripts/phone_preview.sh
      - name: Compile watchOS simulator app
        run: xcodebuild -project FanControlWatch.xcodeproj -scheme FanControlWatch -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Capture watch simulator first launch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.validation_only) }}
        run: bash scripts/simulator_preview.sh
      - name: Compile unsigned watchOS archive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.validation_only) }}
        run: xcodebuild -project FanControlWatch.xcodeproj -scheme FanControl -destination 'generic/platform=iOS' -archivePath build/FanControlWatch.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: FanControlWatch-unsigned
          path: |
            build/watch-*.png
            build/phone-*.png
            build-phone/Build/Products/Debug-iphonesimulator/FanControl.app
            build/FanControlWatch.xcarchive
            build/Build/Products/Debug-watchsimulator/FanControlWatch.app
          retention-days: 7


